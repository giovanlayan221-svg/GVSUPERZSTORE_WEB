.fx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}

.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
.tl{display:flex;justify-content:space-between;margin:6px 0 2px}.tl div{flex:1;text-align:center;font-size:11.5px;color:var(--muted-foreground)}.tl div i{width:28px;height:28px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-style:normal;background:var(--soft)}

/* ===== loading skeleton (gaya Nexus) ===== */
.sk{position:relative;overflow:hidden;background:var(--soft);border:1px solid var(--edge);border-radius:16px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(100deg,transparent 20%,color-mix(in oklch,var(--primary) 16%,transparent) 50%,transparent 80%);animation:skm 1.4s ease-in-out infinite}

/* ===== UI lebih hidup (ringan: hanya transform/opacity, animasi sekali jalan) ===== */

<script>
/* =====================================================================

const FIREBASE_CONFIG = {

/* ---------- util ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const idr = (n) => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const fdate = (iso) => { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? '-' : d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

const slugify = (s) => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const CATS = [
  { id: 'game', slug: 'game', name: 'Top Up Game', desc: 'Diamond, voucher, dan item game favorit' },
  { id: 'apps', slug: 'apps', name: 'Apps Premium', desc: 'Akun & langganan aplikasi premium' }
];
const STATUS = {
  pending_payment: ['Menunggu Pembayaran', 'b-wa'], processing: ['Diproses', 'b-pr'], success: ['Berhasil', 'b-ok'],
  failed: ['Gagal', 'b-er'], cancelled: ['Dibatalkan', 'b-mu']
};
const sbadge = (s) => { const x = STATUS[s] || [s, 'b-mu']; return `<span class="badge ${x[1]}">${esc(x[0])}</span>`; };

function toast(msg, type) {
  let box = $('#toast'); if (!box) return;
  const d = document.createElement('div'); d.className = type || ''; d.textContent = msg; box.appendChild(d);
  setTimeout(() => d.remove(), type === 'er' ? 5000 : 3000);
}
const ok = (m) => toast(m, 'ok'), bad = (m) => toast(m, 'er');
// Error infrastruktur (server/Firestore down, kuota, timeout) -> pesan profesional; error bisnis (saldo kurang, dll) tetap apa adanya
const isInfra = (e) => !!(e && (e.infra || ['resource-exhausted', 'unavailable', 'deadline-exceeded'].includes(e.code) || /quota|resource.exhausted|^Timeout$|Failed to fetch|network/i.test(String(e.message || ''))));
const ERRICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const NICE = { qris: 'QRIS tidak dapat diakses saat ini. Silakan coba beberapa saat lagi.', order: 'Pesanan belum dapat diproses saat ini. Silakan coba beberapa saat lagi.', def: 'Layanan sedang tidak dapat diakses. Silakan coba beberapa saat lagi.' };
function niceErr(e, ctx) { if (isInfra(e)) { console.warn('infra error', e); return NICE[ctx || 'def'] || NICE.def; } return (e && e.message) || NICE.def; }

/* ---------- loading awal & efek klik ---------- */
const T_SPLASH = Date.now();
function hideSplash() {
  const sp = document.getElementById('splash'); if (!sp || sp.dataset.h) return; sp.dataset.h = '1';
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 700); }, Math.max(0, 1200 - (Date.now() - T_SPLASH)));
}
setTimeout(hideSplash, 9000);
document.addEventListener('pointerdown', (e) => {
  const t = e.target && e.target.closest ? e.target.closest('.btn,.tab,.chip') : null; if (!t || t.disabled) return;
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, sp = document.createElement('span');
  sp.className = 'rip'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  t.appendChild(sp); setTimeout(() => sp.remove(), 650);
}, { passive: true });

/* ---------- Firebase ---------- */
const cfgOk = FIREBASE_CONFIG.apiKey && !/^ISI_/.test(FIREBASE_CONFIG.apiKey) && !/^ISI_/.test(FIREBASE_CONFIG.projectId);
let auth = null, db = null;
if (cfgOk) { firebase.initializeApp(FIREBASE_CONFIG); auth = firebase.auth(); db = firebase.firestore(); }

const S = { user: null, profile: null, admin: false, ready: false, settings: {}, games: [], banners: [], socials: [], notifs: [], tab: 'ov', timers: [], cleanup: null, pendingName: null };

async function api(ep, body, _retry) {
  const u = auth.currentUser; if (!u) throw new Error('Belum login');
  const tok = await u.getIdToken(!!_retry);   // percobaan kedua: paksa ambil token baru
  let r; const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 28000);
  try { r = await fetch('/api/' + ep, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(body), signal: ctl.signal }); }
  catch (e) { throw Object.assign(new Error(e && e.name === 'AbortError' ? 'Server tidak merespons, coba lagi' : 'Tidak bisa menghubungi server. Cek koneksi internet.'), { infra: true }); }
  finally { clearTimeout(tm); }
  let d = null; try { d = await r.json(); } catch (e) { /* bukan JSON */ }
  if (r.status === 401 && !_retry && !(d && d.reason === 'project_mismatch')) return api(ep, body, true);   // 401 = ditolak sebelum diproses, aman diulang
  if (!r.ok) throw Object.assign(new Error((d && d.error) || 'Kesalahan server (' + r.status + ')'), { status: r.status, data: d, infra: r.status >= 500 || r.status === 429 });
  return d;
}
const AUTH_MSG = {
  'auth/invalid-credential': 'Email atau password salah', 'auth/wrong-password': 'Email atau password salah', 'auth/user-not-found': 'Email atau password salah',
  'auth/invalid-email': 'Format email tidak valid', 'auth/email-already-in-use': 'Email sudah terdaftar. Silakan masuk.', 'auth/weak-password': 'Password terlalu lemah (minimal 6 karakter)',
  'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.', 'auth/network-request-failed': 'Koneksi internet bermasalah', 'auth/popup-closed-by-user': 'Login dibatalkan'
};
const aerr = (e) => AUTH_MSG[e && e.code] || (e && e.message) || 'Terjadi kesalahan';

}
function closeModal() {
  if (S.cleanup) { try { S.cleanup(); } catch (e) { /* abaikan */ } S.cleanup = null; }
  const o = $('#ov'); if (o) o.remove();
}
function clearTimers() { S.timers.forEach((t) => clearInterval(t)); S.timers = []; }
const every = (fn, ms) => { const t = setInterval(fn, ms); S.timers.push(t); return t; };

/* ---------- data publik ---------- */
/* cache lokal supaya buka web tidak membaca ulang Firestore terus-menerus */
const cget = (k, ttl) => { try { const o = JSON.parse(localStorage.getItem('gvz:' + k) || 'null'); if (o && Date.now() - o.t < ttl) return o.v; } catch (e) { /* abaikan */ } return null; };
const cset = (k, v) => { try { localStorage.setItem('gvz:' + k, JSON.stringify({ t: Date.now(), v })); } catch (e) { /* abaikan */ } };
/* KATALOG SATU DOKUMEN: pembeli membaca 1 dokumen per produk (nominal) dan beberapa dokumen kecil untuk daftar produk,
   bukan ratusan dokumen. Data asli tetap di koleksi aslinya; dokumen katalog adalah salinan TANPA harga modal & kode reseller. */
const DSTRIP = (o) => { const r = {}; Object.keys(o).forEach((k) => { const v = o[k]; if (k === 'cost_price' || k.indexOf('provider') === 0) return; if (typeof v === 'string' && v.indexOf('data:') === 0) return; r[k] = v; }); return r; };
const META = () => db.collection('catalog').doc('pub_meta');
async function rebuildDens(gids) {
  const v = nowIso(), dv = {};
  for (const gid of gids) {
    const [ds, ss] = await Promise.all([db.collection('denominations').where('game_id', '==', gid).get(), db.collection('subcategories').where('game_id', '==', gid).get()]);
    await db.collection('catalog').doc('dens_' + gid).set({ ver: v, d: ds.docs.map((x) => ({ id: x.id, ...DSTRIP(x.data()) })), s: ss.docs.map((x) => ({ id: x.id, ...x.data() })) });
    dv[gid] = v;
  }
  await META().set({ dv }, { merge: true });   // penanda kecil: pembeli langsung tahu nominal produk ini berubah
}
async function rebuildAllDens() {
  const [gs, ds, ss] = await Promise.all([db.collection('games').get(), db.collection('denominations').get(), db.collection('subcategories').get()]);
  const by = {}; gs.docs.forEach((g) => { by[g.id] = { d: [], s: [] }; });
  ds.docs.forEach((x) => { const g = x.data().game_id; if (by[g]) by[g].d.push({ id: x.id, ...DSTRIP(x.data()) }); });
  ss.docs.forEach((x) => { const g = x.data().game_id; if (by[g]) by[g].s.push({ id: x.id, ...x.data() }); });
  const ids = Object.keys(by), v = nowIso(), dv = {};
  for (let i = 0; i < ids.length; i += 20) { const bt = db.batch(); ids.slice(i, i + 20).forEach((g) => { bt.set(db.collection('catalog').doc('dens_' + g), { ver: v, d: by[g].d, s: by[g].s }); dv[g] = v; }); await bt.commit(); }
  await META().set({ dv }, { merge: true });
}
async function bumpVer(gids) {   // dipanggil setelah admin mengubah nominal: bangun ulang katalog produk yang berubah (kosong = semua)
  const ids = [...new Set((gids || []).filter(Boolean))];
  try { Object.keys(localStorage).filter((k) => ids.length ? ids.some((g) => k === 'gvz:dens:' + g) : k.indexOf('gvz:dens:') === 0).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* abaikan */ }
  try { if (ids.length) await rebuildDens(ids); else await rebuildAllDens(); }
  catch (e) { bad('Perubahan tersimpan, tapi katalog pembeli gagal diperbarui: ' + e.message); }
}
async function rebuildAll() {
  if (!confirm('Sinkronkan SEMUA data ke pembeli sekarang? Ini membaca semua produk dan nominal sekali, lalu semua pengunjung otomatis memuat data terbaru.')) return;
  try {
    await rebuildPub(); await rebuildAllDens();
    try { Object.keys(localStorage).filter((k) => k.indexOf('gvz:') === 0 && k !== 'gvz:mmtiers').forEach((k) => localStorage.removeItem(k)); } catch (e) { /* abaikan */ }
    ok('Semua data sudah disinkronkan ke pembeli');

}
async function pubFromSource() {
  const [gs, bs, ss, ls] = await Promise.all([db.collection('games').get(), db.collection('banners').get(), db.collection('site_settings').get(), db.collection('social_links').get()]);
  return { games: gs.docs.map((d) => ({ id: d.id, ...d.data() })), banners: bs.docs.map((d) => ({ id: d.id, ...d.data() })), socials: ls.docs.map((d) => ({ id: d.id, ...d.data() })), settings: ss.docs.map((d, i) => { const x = d.data(); return { key: x.key || d.id, value: x.value }; }) };
}
// Data publik (produk, banner, pengaturan, link sosial) dibaca LANGSUNG dari koleksi aslinya, jadi tidak ada salinan yang bisa basi.
// Admin hanya menaikkan "versi" di dokumen kecil catalog/pub_meta setiap kali menyimpan. Pembeli memantau dokumen itu secara realtime.
let PUBVER = '';
async function bumpPub() { const v = nowIso(); await META().set({ ver: v }, { merge: true }); return v; }
async function rebuildPub() { const c = await pubFromSource(); c.ver = await bumpPub(); return c; }
async function loadPublic(force) {
  const e0 = cget('pub2', Infinity); let c = null;
  if (force && S.admin) { c = await rebuildPub(); cset('pub2', c); }
  else {
    let ver = '';
    try {
      const mt = await withTimeout(META().get(), 30000);
      S.meta = mt.exists ? mt.data() : {}; ver = S.meta.ver || '';
      if (e0 && ver && e0.ver === ver) c = e0;   // versi sama: pakai salinan lokal (hemat baca)
    } catch (e) { if (e0) c = e0; }               // offline/lambat: pakai salinan terakhir
    if (!c) { c = { ...(await withTimeout(pubFromSource(), 45000)), ver }; cset('pub2', c); }
  }
  PUBVER = c.ver || '';
  S.games = c.games.filter((g) => g.active !== false).sort(byOrder);
  S.banners = c.banners.filter((b) => b.active !== false).sort(byOrder);
  S.socials = c.socials.filter((b) => b.active !== false).sort(byOrder);
  S.settings = {}; c.settings.forEach((x) => { S.settings[x.key] = x.value; });
}
function watchPub() {   // perubahan dari admin langsung masuk ke halaman pembeli tanpa refresh
  let first = true;
  META().onSnapshot((snap) => {
    const prev = (S.meta && S.meta.dv) || {}, m = snap.exists ? snap.data() : {};
    S.meta = m;
    if (first) { first = false; return; }
    if (snap.metadata.hasPendingWrites || S.admin) return;
    const p = location.hash.replace(/^#\/?/, '').split('/')[0];
    if ((m.ver || '') !== PUBVER) loadPublic().then(() => { chrome(); if (p === '') { clearTimers(); pgHome(); } }).catch(() => { /* abaikan */ });
    else if (p === 'game' && G && G.game && !G.sel && ((m.dv || {})[G.game.id] || '') !== (prev[G.game.id] || '')) route();

}
const setting = (k, def) => (S.settings[k] == null || S.settings[k] === '' ? def : S.settings[k]);

/* ---------- sesi ---------- */
async function refreshProfile() {
  if (!auth.currentUser) { S.profile = null; S.admin = false; return; }
  const s = await db.collection('profiles').doc(auth.currentUser.uid).get();
  S.profile = s.exists ? { id: s.id, ...s.data() } : null;
  S.admin = !!(S.profile && S.profile.role === 'admin');

async function loadNotifs() {
  if (!auth.currentUser) { S.notifs = []; return; }
  try {
    const base = db.collection('notifications').where('user_id', '==', auth.currentUser.uid); let q;
    try { q = await base.orderBy('created_at', 'desc').limit(30).get(); }   // perlu indeks gabungan (Firebase memberi link pembuatnya di Console browser)
    catch (e) { q = await base.limit(60).get(); }                             // cadangan: tetap hemat, maksimal 60 baca

  } catch (e) { S.notifs = []; }

  S.user = u;

    try { await withTimeout(refreshProfile(), 6000); } catch (e) { console.warn('refreshProfile', e.message); }   // baca profil langsung dari Firestore (cepat)

      try { await withTimeout(api('account', { action: 'ensureProfile', display_name: S.pendingName || u.displayName || undefined }), 9000); await withTimeout(refreshProfile(), 6000); }
      catch (e) { console.warn('ensureProfile', e.message); setTimeout(() => bad('Login berhasil, tapi akun belum tersinkron dengan server: ' + e.message), 400); }
    } else { api('account', { action: 'ensureProfile', display_name: S.pendingName || u.displayName || undefined }).catch((e) => console.warn('ensureProfile', e.message)); }   // sinkron diam-diam di latar
    S.pendingName = null;
    loadNotifs().then(() => chrome()).catch(() => { /* abaikan */ });
  } else { S.profile = null; S.admin = false; S.notifs = []; }

}

/* ---------- LOADING QRIS (ungu, ringan) ---------- */
const QLD_MSG = ['Membuat QRIS...', 'Menghubungi penyedia pembayaran...', 'Menyiapkan kode QR...'];
function qLoad(on, txt) {
  let el = document.getElementById('qld');
  clearInterval(window.__qlt);
  if (!on) { if (el) { el.classList.add('out'); setTimeout(() => { const e = document.getElementById('qld'); if (e && e.classList.contains('out')) e.remove(); }, 220); } return; }
  if (!el) {
    el = document.createElement('div'); el.id = 'qld'; el.className = 'qld';
    el.innerHTML = '<div class="qld-card"><div class="qld-box"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><rect x="4" y="4" width="20" height="20" rx="4"/><rect x="40" y="4" width="20" height="20" rx="4"/><rect x="4" y="40" width="20" height="20" rx="4"/><path d="M12 12h4v4h-4zM48 12h4v4h-4zM12 48h4v4h-4z" fill="currentColor" stroke="none"/><path d="M40 40h8v8h-8zM52 52h8v8h-8zM52 40h8M40 56h4"/></svg><i></i></div><div class="b" id="qld_t"></div><div class="qld-dots"><b></b><b></b><b></b></div></div>';
    document.body.appendChild(el);
  }
  el.classList.remove('out');
  const t = document.getElementById('qld_t'); let i = 0; t.textContent = txt || QLD_MSG[0];
  if (!txt) window.__qlt = setInterval(() => { i = (i + 1) % QLD_MSG.length; t.textContent = QLD_MSG[i]; }, 1800);
}

/* ---------- PEMBAYARAN (QRIS dinamis PunyaKios, QR tampil di dalam web) ---------- */
function fmtLeft(ms) {
  if (ms <= 0) return '00:00';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60, p = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${p(h)}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}
function qrbox(el, text, sz) { if (!el) return; el.innerHTML = ''; try { new QRCode(el, { text, width: sz, height: sz, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { el.textContent = 'QR belum bisa ditampilkan, muat ulang halaman'; } }
function qrSave() {
  const c = document.querySelector('#qrq canvas'); if (!c) return bad('QR belum siap');
  const o = document.createElement('canvas'); o.width = o.height = 340; const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 340, 340); x.imageSmoothingEnabled = false; x.drawImage(c, 30, 30, 280, 280);
  try { const a = document.createElement('a'); a.href = o.toDataURL('image/png'); a.download = 'QRIS-GVSUPERZSTORE.png'; a.click(); ok('QR disimpan'); } catch (e) { bad('Gagal menyimpan QR'); }
}
// it = respons pkqris create. onDone(r) dipanggil bila pembayaran "selesai" / "dikreditkan".
function showPay(it, title, onDone) {
  let done = false;
  openModal(`<div class="phd"><div class="xs brk" style="opacity:.85">${esc(title)}</div><div class="phd-n">${idr(it.total)}</div><div class="phd-r"><span>Nominal ${idr(it.base)}</span>${it.payFee > 0 ? `<span>Biaya QRIS ${idr(it.payFee)}</span>` : ''}</div><div class="phd-t"><i></i><span id="pleft">Berlaku ${fmtLeft(it.expiresAt - Date.now())}</span></div></div>
    <div id="pbody"><div class="qrwrap mt"><div id="qrq" class="qrbox"></div></div>
    <p class="mu xs tc">Scan dengan e-wallet atau m-banking apa pun yang mendukung QRIS. Status dicek otomatis setelah kamu bayar.</p>
    <div class="row gap mt2"><button class="btn full" onclick="qrSave()">${ic('download')} Simpan QR</button><button class="btn pr full" id="pchk" onclick="payCheck(true)">${ic('check')} Sudah bayar</button></div>
    </div>
    <button class="btn full mt2" onclick="closeModal()">Tutup</button>`);
  qrbox($('#qrq'), it.qris, 220);
  const finish = (html) => { const b = $('#pbody'); if (b) b.innerHTML = html; };
  const check = async (manual) => {
    if (done) return;
    const btn = $('#pchk'); if (manual && btn) btn.disabled = true;
    try {
      const r = await api('pkqris', { action: 'check', id: it.id }); if (done) return;
      if (r.status === 'selesai' || r.status === 'dikreditkan') {
        done = true; finish(`<div class="tc p"><div class="bigic">${ICO.check}</div><div class="b">${r.status === 'selesai' ? 'Pembayaran diterima' : 'Dana masuk ke saldo akun'}</div></div>`);
        setTimeout(() => { closeModal(); onDone(r); }, 1100);
      } else if (r.status === 'selisih' || r.status === 'perlu-dicek' || r.status === 'gagal') {
        done = true; finish(`<div class="tc p"><div class="bigic wa">${ICO.alert}</div><div class="sm mu">Pembayaran perlu dicek admin. Hubungi admin dengan bukti pembayaran bila saldo/pesanan belum masuk.</div></div>`);
      } else if (r.status === 'kadaluarsa') { const l = $('#pleft'); if (l) l.textContent = 'QRIS kedaluwarsa'; }
    } catch (e) { if (manual) bad(e.message); } finally { if (manual && btn) btn.disabled = false; }
  };
  window.payCheck = check;
  const t1 = setInterval(() => { const l = $('#pleft'); if (l && !done) l.textContent = it.expiresAt - Date.now() > 0 ? 'Berlaku ' + fmtLeft(it.expiresAt - Date.now()) : 'QRIS kedaluwarsa'; }, 1000);
  const t2 = setInterval(() => check(false), 4000);
  S.cleanup = () => { clearInterval(t1); clearInterval(t2); done = true; };
}

/* ---------- gambar: dikecilkan lalu disimpan sebagai data URL di dokumen (tanpa Firebase Storage) ---------- */
function compressImg(file, maxSide) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Gambar tidak bisa dibaca')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      let sc = Math.min(1, maxSide / Math.max(img.width, img.height));
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        for (const q of [0.85, 0.72, 0.6]) { const o = c.toDataURL('image/webp', q); if (o.length <= 600000) return resolve(o); }
        sc *= 0.75;
      }
      reject(new Error('Gambar terlalu besar, pakai gambar yang lebih kecil'));
    };
    img.src = url;
  });
}
async function pickImg(k, max, input) {
  const f = input.files && input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) return bad('File harus berupa gambar');
  try { const d = await compressImg(f, max); $('#f_' + k).value = d; const pv = $('#pv_' + k); pv.src = d; pv.style.display = 'block'; ok('Gambar siap — jangan lupa Simpan'); } catch (e) { bad(e.message); }
}

const toLocal = (iso) => { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
function fieldHtml(f, v) {
  const id = 'f_' + f.k, lab = `<label class="l">${esc(f.l)}${f.req ? ' *' : ''}</label>`;
  if (f.t === 'check') return `<label class="row mt2" style="gap:8px"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> <span>${esc(f.l)}</span></label>`;
  if (f.t === 'textarea') return lab + `<textarea class="inp" id="${id}">${esc(v || '')}</textarea>`;
  if (f.t === 'select') return lab + `<select class="inp" id="${id}">${(f.opts || []).map((o) => `<option value="${esc(o[0])}" ${String(v == null ? '' : v) === String(o[0]) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  if (f.t === 'image') return lab + `<input type="file" accept="image/*" class="inp" onchange="pickImg('${f.k}',${f.max || 640},this)"><input type="hidden" id="${id}" value="${esc(v || '')}"><img id="pv_${f.k}" class="img-prev" style="display:${v ? 'block' : 'none'}" src="${esc(v || '')}" alt=""><button class="btn sm mt2" type="button" onclick="clearImg('${f.k}')">Hapus gambar</button>`;
  if (f.t === 'date') return lab + `<input class="inp" type="datetime-local" id="${id}" value="${esc(toLocal(v))}">`;
  return lab + `<input class="inp" id="${id}" type="${f.t === 'number' ? 'number' : 'text'}" ${f.t === 'number' ? 'inputmode="decimal"' : ''} value="${esc(v == null ? '' : v)}" placeholder="${esc(f.ph || '')}">`;
}
function readForm(fields) {
  const o = {};
  for (const f of fields) {
    const el = $('#f_' + f.k); if (!el) continue;
    if (f.t === 'check') o[f.k] = el.checked;
    else if (f.t === 'number') { const raw = String(el.value).trim(); if (raw === '') { if (f.req) throw new Error(f.l + ' wajib diisi'); o[f.k] = f.opt ? null : (f.def != null ? f.def : 0); } else { const n = Number(raw); if (!Number.isFinite(n)) throw new Error(f.l + ' harus angka'); o[f.k] = n; } }
    else if (f.t === 'date') o[f.k] = el.value ? new Date(el.value).toISOString() : null;
    else { const v = String(el.value).trim(); if (f.req && !v) throw new Error(f.l + ' wajib diisi'); o[f.k] = v === '' && f.opt ? null : v; }
  }
  return o;
}

async function provDiag() {

  try { const r = await api('pkqris', { action: 'diag' }); out.textContent = r.rows.map((x) => `${x.kind === 'deposit' ? 'Deposit' : x.name || 'Pesanan'} · ${idr(x.total)} · ${x.user}\n  status: ${x.status}${x.provStatus ? ' (provider: ' + x.provStatus + ')' : ''}${x.err ? ' — ' + x.err : ''}${x.order ? '\n  pesanan: ' + x.order.status + ' · ' + x.order.kirim + (x.order.message ? ' — ' + x.order.message : '') : ''}`).join('\n\n') || 'Belum ada pembayaran.'; } catch (e) { out.textContent = 'Gagal: ' + e.message; }
}

/* ---------- MULAI ---------- */
window.addEventListener('hashchange', route);
(async function boot() {
  if (!cfgOk) {
    hideSplash(); $('#view').innerHTML = `<div class="cfg glass"><h2 class="gt">Firebase belum diisi</h2><p class="mu">Buka file <b>index.html</b>, cari <b>FIREBASE_CONFIG</b> di bagian atas script, lalu isi dengan config dari Firebase (Project settings &gt; Your apps &gt; Web). Setelah itu upload ulang.</p></div>`;
    return;
  }
  try { await loadPublic(); } catch (e) { console.warn('loadPublic', e); hideSplash(); const m = $('#view'); m.removeAttribute('aria-busy'); m.innerHTML = `<div class="cfg glass tc"><div class="err-ic">${ERRICO}</div><h2 class="gt">Website tidak dapat diakses</h2><p class="mu">Layanan kami sedang mengalami gangguan atau terlalu padat. Silakan coba lagi dalam beberapa saat.</p><button class="btn pr" onclick="location.reload()">Muat ulang</button></div>`; return; }
  S.ready = true; $('#view').removeAttribute('aria-busy');
  try { watchPub(); } catch (e) { console.warn('watchPub', e); }
  auth.onAuthStateChanged(async (u) => { try { await onUser(u); } finally { hideSplash(); } });
})();

</script>
